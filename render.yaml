# Render blueprint for Thrap.
#
# This must be a Web Service, not a Static Site. The API routes are served by
# a Node process; a static deployment would load the page and fail every
# message, sending each user straight to the escalation screen.

services:
  - type: web
    name: thrap
    runtime: node
    plan: free
    region: frankfurt

    buildCommand: npm ci && npm run build
    startCommand: npm start

    # Render holds traffic until this passes. The check awaits the knowledge
    # index, so nobody reaches a half-built retriever after a cold start.
    healthCheckPath: /healthz

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Set in the Render dashboard, never committed. `sync: false` tells
      # Render to prompt for it rather than read it from this file.
      - key: OPENROUTER_API_KEY
        sync: false

      # Optional overrides; defaults are in .env.example.
      # - key: OPENROUTER_MODEL
      #   value: anthropic/claude-haiku-4.5
